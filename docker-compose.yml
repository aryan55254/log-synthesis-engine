services:
  # Stage 1: Optimized Developer-Scale ClickHouse
  clickhouse_analytics:
    image: clickhouse/clickhouse-server:latest
    container_name: log_engine_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-log_analytics_db}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aryan_analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics_password_99}
      # ⚡ THE ENVIRONMENT FIX: ClickHouse uses these env prefixes to tune settings on boot
      CLICKHOUSE_SETTING_max_server_memory_usage: 1073741824
      CLICKHOUSE_SETTING_max_threads: 2
      CLICKHOUSE_SETTING_background_pool_size: 2
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 1500M
          cpus: '1.5'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Stage 2: Your In-Memory Lambda Processing Engine
  engine:
    build: .
    container_name: log_engine
    restart: "no"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLICKHOUSE_URL=http://clickhouse_analytics:8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-log_analytics_db}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-aryan_analytics}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-analytics_password_99}
    ports:
      - "3000:3000"
    # THE UNMISTAKABLE SHIELD CONFIGURATION:
    volumes:
      - .:/app                  
      - /app/node_modules       
      - /app/dist               
    deploy:
      resources:
        limits:
          memory: 1027M
          cpus: '1.5'
    depends_on:
      clickhouse_analytics:
        condition: service_healthy

volumes:
  clickhouse_data: